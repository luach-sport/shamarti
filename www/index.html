<!doctype html>
<html lang="he" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8">
<meta name="description" content="שמרתי – שומרים סרטונים מטיקטוק, אינסטגרם ויוטיוב, אתרים וכל קישור, עם תיאור משלך וקטגוריות.">
<title>שמרתי</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon-512.png">
<script>
  (function () {
    try {
      var t = localStorage.getItem('shamarti.theme') || 'system';
      if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
