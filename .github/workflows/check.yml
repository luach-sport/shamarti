name: Native check
on:
  push:
    branches: [native-check]
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: '1.0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: node scripts/prepare-web.mjs
      - run: npx cap add android
      - run: bash scripts/patch-android.sh
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Badging
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E "package|application-label|sdkVersion|targetSdk|launchable" | head
          "$BT/aapt" dump xmltree android/app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml | grep -E "action|mimeType" | head -20
          npm ls --depth=0
